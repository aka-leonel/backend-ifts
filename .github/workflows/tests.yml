name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black pylint

      - name: Correr tests con coverage (mínimo 60%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Verificar formato con black (informativo, no bloquea el build todavía)
        run: black --check --diff app tests || true

      - name: Lint con pylint (informativo, no bloquea el build todavía)
        run: pylint app --exit-zero