services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ifts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ifts}
      POSTGRES_DB: ${POSTGRES_DB:-miifts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ifts}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ifts}:${POSTGRES_PASSWORD:-ifts}@db:5432/${POSTGRES_DB:-miifts}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
